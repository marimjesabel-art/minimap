<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamer Hoa Mùa Xuân - ThaiSonOO4</title>
    <!-- Phông chữ kute, mềm mại -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-light: #fff0f3;
            --pink-main: #ffb3c6;
            --pink-dark: #ff8fab;
            --glass-bg: rgba(255, 255, 255, 0.35);
            --glass-border: rgba(255, 255, 255, 0.6);
            --text-color: #5c3a41;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
            font-family: 'Nunito', sans-serif;
            color: var(--text-color);
            overflow: hidden;
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
        }

        /* Vùng chứa Minimap */
        .minimap-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .stream-title {
            font-family: 'Pacifico', cursive;
            font-size: 3rem;
            color: #fff;
            text-shadow: 2px 2px 8px rgba(255, 143, 171, 0.6);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .iframe-wrapper {
            width: 100%;
            max-width: 850px;
            aspect-ratio: 1 / 1; /* Cực kỳ quan trọng để giữ tỷ lệ vuông 2K của bạn */
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 3px solid var(--glass-border);
            border-radius: 25px;
            padding: 8px;
            box-shadow: 0 15px 35px rgba(238, 156, 167, 0.4);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 18px;
            background-color: #000;
        }

        /* Khung Chat Mùa Xuân */
        .chat-section {
            width: 380px;
            margin: 20px 20px 20px 0;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid var(--glass-border);
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(238, 156, 167, 0.3);
            overflow: hidden;
        }

        .chat-header {
            background: rgba(255, 255, 255, 0.5);
            padding: 15px 20px;
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--pink-dark);
            border-bottom: 2px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Tùy chỉnh thanh cuộn chat */
        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-thumb { background: var(--pink-main); border-radius: 10px; }

        .chat-msg {
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 15px;
            border-radius: 20px;
            border-bottom-left-radius: 5px;
            font-size: 0.95rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            animation: popIn 0.3s ease-out;
            width: fit-content;
            max-width: 85%;
        }

        .chat-msg.streamer {
            background: var(--pink-main);
            color: #fff;
            align-self: flex-end;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 5px;
        }

        .chat-msg .user {
            font-weight: 800;
            margin-right: 5px;
            color: var(--pink-dark);
        }

        .chat-msg.streamer .user {
            color: #fff;
        }

        .chat-input-area {
            padding: 15px;
            background: rgba(255, 255, 255, 0.4);
            border-top: 2px solid var(--glass-border);
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid transparent;
            border-radius: 20px;
            outline: none;
            font-family: 'Nunito', sans-serif;
            background: rgba(255, 255, 255, 0.8);
            color: var(--text-color);
            transition: 0.3s;
        }

        .chat-input-area input:focus {
            border-color: var(--pink-main);
            box-shadow: 0 0 10px rgba(255, 179, 198, 0.5);
        }

        .chat-input-area button {
            background: var(--pink-dark);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 0 20px;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(255, 143, 171, 0.4);
        }

        .chat-input-area button:hover {
            background: #ff7496;
            transform: translateY(-2px);
        }

        @keyframes popIn {
            0% { opacity: 0; transform: translateY(10px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

    <div class="minimap-section">
        <div class="stream-title">🌸 Hoa Mùa Xuân 🌸</div>
        <div class="iframe-wrapper">
            <!-- Luồng 2K siêu nét của bạn -->
            <iframe src="https://vdo.ninja/?view=c4Hg53K&label=ThaiSonOO4&autostart=1&clean=1" allow="autoplay; fullscreen"></iframe>
        </div>
    </div>

    <div class="chat-section">
        <div class="chat-header">
            <span>🌸</span> Trò Chuyện Trực Tiếp
        </div>
        
        <div class="chat-box" id="chatBox">
            <!-- Các tin nhắn giả lập ban đầu để bạn xem giao diện -->
            <div class="chat-msg"><span class="user">Viewer_1:</span> <span class="text">Minimap nét quá Thái Sơn ơi!</span></div>
            <div class="chat-msg streamer"><span class="user">ThaiSonOO4:</span> <span class="text">Cảm ơn anh em đã xem stream nhé 🌸</span></div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Nhập lời yêu thương..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()">Gửi</button>
        </div>
    </div>

    <!-- Script nhỏ để bạn gõ thử tin nhắn cho vui mắt -->
    <script>
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (text === '') return;

            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-msg streamer'; // Đặt mặc định bạn là streamer
            
            msgDiv.innerHTML = `<span class="user">ThaiSonOO4:</span> <span class="text">${text}</span>`;
            
            chatBox.appendChild(msgDiv);
            input.value = '';
            
            // Tự động cuộn xuống tin nhắn mới nhất
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
