<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG Live Minimap - ThaiSonOO4</title>
    <!-- Nhúng phông chữ UI hiển thị -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Teko:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-yellow: #f2a900;
            --bg-color: #0a0b0d;
            --panel-bg: #14161a;
        }
        
        body { 
            margin: 0; 
            background-color: var(--bg-color); 
            background-image: radial-gradient(circle at center, #14161a 0%, #0a0b0d 100%);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .title {
            font-family: 'Teko', sans-serif;
            font-size: 3.5rem;
            color: var(--accent-yellow);
            margin: 0;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(242, 169, 0, 0.4);
            line-height: 1;
        }

        .live-badge {
            background-color: #ff2a2a;
            color: white;
            padding: 4px 12px;
            border-radius: 2px;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 10px rgba(255, 42, 42, 0.5);
        }

        .minimap-wrapper {
            position: relative;
            width: 90vw;
            max-width: 500px; /* Khớp với Canvas OBS */
            aspect-ratio: 1 / 1; 
            background-color: #000;
            border: 2px solid #2a2d35;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 20px rgba(242, 169, 0, 0.15);
            padding: 4px;
            /* Góc viền cách điệu */
            background: linear-gradient(45deg, var(--accent-yellow) 0%, transparent 3%, transparent 97%, var(--accent-yellow) 100%),
                        linear-gradient(-45deg, var(--accent-yellow) 0%, transparent 3%, transparent 97%, var(--accent-yellow) 100%);
        }

        .minimap-wrapper::after {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            pointer-events: none;
        }

        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block;
            background-color: #000;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        
        .footer {
            margin-top: 25px;
            color: #666;
            font-size: 1rem;
            letter-spacing: 2px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .footer::before, .footer::after {
            content: "";
            display: block;
            width: 30px;
            height: 1px;
            background-color: #444;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="live-badge">LIVE</div>
        <h1 class="title">TACTICAL RADAR</h1>
    </div>

    <div class="minimap-wrapper">
        <!-- Đã chèn sẵn Viewer Link của bạn và thêm tham số autostart=1, clean=1 để tự chạy và ẩn UI rườm rà của player -->
        <iframe src="https://vdo.ninja/?view=c4Hg53K&label=ThaiSonOO4&autostart=1&clean=1" allow="autoplay; fullscreen"></iframe>
    </div>

    <div class="footer">
        THAI SON OO4 / SECURE FEED
    </div>
</body>
</html>
