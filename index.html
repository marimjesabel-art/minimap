<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TACTICAL RADAR - ThaiSonOO4</title>
    <!-- Phông chữ Gaming góc cạnh và gọn -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-red: #ff3b30;
            --dark-gray: #121212;
            --text-main: #f0f0f0;
        }
        
        body { 
            margin: 0; 
            padding: 0;
            background-color: #000000; /* Đen tuyệt đối - tắt Pixel màn hình OLED để tiết kiệm pin */
            color: var(--text-main);
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Khung thông tin bên trái - Tối giản */
        .sidebar {
            width: 320px;
            background-color: #000000;
            border-right: 1px solid #1a1a1a;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            box-sizing: border-box;
        }

        .live-status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background-color: var(--neon-red);
            border-radius: 50%;
        }

        .live-text {
            color: var(--neon-red);
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 2px;
            font-family: 'Orbitron', sans-serif;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: #ffffff;
            margin: 0 0 35px 0;
            line-height: 1.1;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .info-box {
            background-color: #050505;
            border: 1px solid #1a1a1a;
            border-left: 3px solid var(--neon-red);
            padding: 12px 15px;
            margin-bottom: 15px;
            font-size: 1rem;
        }
        
        .info-label {
            color: #555555;
            font-size: 0.8rem;
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        .system-status {
            margin-top: auto;
            font-size: 0.8rem;
            color: #333333;
            border-top: 1px solid #111;
            padding-top: 15px;
        }

        /* Khung hiển thị Minimap bên phải */
        .map-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background-color: #000000;
        }

        .iframe-wrapper {
            position: relative;
            height: 96%; /* Tối ưu kích thước dọc */
            aspect-ratio: 1 / 1; /* Cố định vuông 2K (1440x1440) của bạn */
            border: 1px solid #222222;
            background-color: #000000;
            padding: 3px;
            box-sizing: border-box;
        }

        /* Thêm góc ngắm đậm chất quân sự nhẹ nhàng */
        .iframe-wrapper::before, .iframe-wrapper::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            border: 2px solid var(--neon-red);
            pointer-events: none;
        }
        .iframe-wrapper::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .iframe-wrapper::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background-color: #000000;
        }

        /* Khung Chat bên phải - Siêu tiết kiệm tài nguyên */
        .chat-section {
            width: 320px;
            background-color: #000000;
            border-left: 1px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .chat-header {
            padding: 15px 20px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-main);
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-box::-webkit-scrollbar { width: 3px; }
        .chat-box::-webkit-scrollbar-thumb { background: #1a1a1a; }

        .chat-msg {
            font-size: 0.9rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .chat-msg .user {
            font-weight: 700;
            color: var(--neon-red);
            margin-right: 5px;
        }

        .chat-msg .text {
            color: #888888;
        }

        .chat-input-area {
            padding: 15px;
            border-top: 1px solid #1a1a1a;
            display: flex;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #222222;
            background-color: #080808;
            color: var(--text-main);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: var(--neon-red);
        }

        .chat-input-area button {
            background-color: #000000;
            color: var(--neon-red);
            border: 1px solid var(--neon-red);
            padding: 0 15px;
            font-family: 'Share Tech Mono', monospace;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chat-input-area button:hover {
            background-color: var(--neon-red);
            color: #000000;
        }

        /* Ẩn các cột phụ trên điện thoại dọc để tập trung vào bản đồ */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: 100vh;
            }
            .sidebar, .chat-section {
                display: none; /* Ẩn sidebar và chat khi xem dọc bằng điện thoại */
            }
            .map-section {
                padding: 5px;
                height: 100%;
            }
            .iframe-wrapper {
                height: auto;
                width: 98vw;
                max-width: 98vw;
                aspect-ratio: 1/1;
            }
        }
    </style>
</head>
<body>

    <!-- BẢNG ĐIỀU KHIỂN BÊN TRÁI -->
    <div class="sidebar">
        <div class="live-status">
            <div class="live-dot"></div>
            <div class="live-text">LIVE FEED</div>
        </div>
        
        <h1 class="title">TACTICAL<br>RADAR</h1>
        
        <div class="info-box">
            <div class="info-label">OPERATOR</div>
            <div>THAI SON OO4</div>
        </div>
        
        <div class="info-box">
            <div class="info-label">SIGNAL STATUS</div>
            <div style="color: #4ade80;">ENCRYPTED & STABLE</div>
        </div>
        
        <div class="info-box">
            <div class="info-label">VIDEO PRESET</div>
            <div>2K QUAD-HD / 60 FPS</div>
        </div>

        <div class="system-status">
            SECURE LINK // BATTERY-SAVER MODE
        </div>
    </div>

    <!-- KHU VỰC MINIMAP -->
    <div class="map-section">
        <div class="iframe-wrapper">
            <!-- Luồng 2K vuông của bạn -->
            <iframe src="https://vdo.ninja/?view=c4Hg53K&label=ThaiSonOO4&autostart=1&clean=1" allow="autoplay; fullscreen"></iframe>
        </div>
    </div>

    <!-- KHUNG TRÒ CHUYỆN BÊN PHẢI -->
    <div class="chat-section">
        <div class="chat-header">
            COMMS_CENTER
        </div>
        
        <div class="chat-box" id="chatBox">
            <div class="chat-msg"><span class="user">Viewer_01:</span><span class="text">Minimap mượt quá sếp! 60fps đỉnh thật.</span></div>
            <div class="chat-msg"><span class="user">ThaiSonOO4:</span><span class="text">Cứ tự nhiên xem nhé anh em 🎯</span></div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Nhập tin nhắn..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()">SEND</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (text === '') return;

            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-msg';
            
            msgDiv.innerHTML = `<span class="user">ThaiSonOO4:</span><span class="text" style="color: #ffffff;">${text}</span>`;
            
            chatBox.appendChild(msgDiv);
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
